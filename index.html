    .from("tracker_data")

// ─── CARDIO STRUCTURE ─────────────────────────────────────────────────────────

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function calcExerciseVolume(sets) {
  return (sets || []).reduce((total, s) => (parseFloat(s.kg)||0) * (parseInt(s.reps)||0) + total, 0);
}
function calcWorkoutVolume(exData) {
  return Object.values(exData || {}).reduce((t, sets) => t + calcExerciseVolume(sets), 0);
}
function calcWeekVolume(weekData) {
  return WORKOUTS.reduce((t, w) => t + calcWorkoutVolume(weekData?.[w.id]), 0);
}
function formatKg(n) { return n % 1 === 0 ? n.toFixed(0) : n.toFixed(1); }
function formatVolume(n) { return n >= 1000 ? `${(n/1000).toFixed(1)}t` : `${Math.round(n)}kg`; }
function formatMin(n) { return n >= 60 ? `${Math.floor(n/60)}h${n%60 ? (n%60)+"m" : ""}` : `${n}min`; }
function calcDayCardioMin(entries) { return (entries || []).reduce((t, e) => t + (parseInt(e.minutos)||0), 0); }
function calcWeekCardioMin(cardioData) { return CARDIO_DAYS.reduce((t, d) => t + calcDayCardioMin(cardioData?.[d.id]), 0); }
function emptyExerciseSets(ex) { return Array.from({ length: ex.sets }, () => ({ kg: "", reps: "" })); }
function emptyCardioData() {
  const d = {};
  CARDIO_DAYS.forEach(day => { d[day.id] = []; });
  return d;
}
function emptyWeekData() {
  const d = {};
  WORKOUTS.forEach(w => { d[w.id] = {}; w.exercises.forEach(ex => { d[w.id][ex.id] = emptyExerciseSets(ex); }); });
  d.cardio = emptyCardioData();
  return d;
}

// ─── COMPONENTS ──────────────────────────────────────────────────────────────
function ScoreBar({ pct, color, height = 6 }) {
  return (
    <div style={{ background: "#1e1e2e", borderRadius: 99, height, overflow: "hidden" }}>
      <div style={{ width: `${Math.min(pct,100)}%`, background: color, height: "100%", borderRadius: 99, transition: "width 0.4s" }} />
    </div>
  );
}

function ExerciseRow({ exercise, workout, sets, onChange }) {
  const repsHint = exercise.repsScheme.split("·");
  const vol = calcExerciseVolume(sets);
  const autoFillReps = (i) => {
    const s = sets[i];
    if (s.kg && !s.reps && repsHint[i]) onChange(i, "reps", repsHint[i]);
  };
  return (
    <div style={{ background: "#0e0e18", borderRadius: 10, padding: "12px 14px", marginBottom: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
        <div>
          <div style={{ color: "#ddd", fontSize: 13, fontWeight: 600 }}>{exercise.name}</div>
          <div style={{ color: "#444", fontSize: 11, marginTop: 2 }}>{exercise.sets} séries · {exercise.repsScheme} reps</div>
        </div>
        {vol > 0 && (
          <div style={{ textAlign: "right" }}>
            <div style={{ color: workout.color, fontWeight: 800, fontSize: 14 }}>{formatVolume(vol)}</div>
            <div style={{ color: "#444", fontSize: 9 }}>volume</div>
          </div>
        )}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {sets.map((set, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{
              width: 22, height: 22, borderRadius: 6, flexShrink: 0,
              background: set.kg && set.reps ? workout.color + "22" : "#1e1e2e",
              color: set.kg && set.reps ? workout.color : "#444",
              display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700,
            }}>{i + 1}</div>
            <div style={{ display: "flex", gap: 6, flex: 1 }}>
              <input type="number" inputMode="decimal" placeholder="kg" value={set.kg}
                onChange={e => onChange(i, "kg", e.target.value)} onBlur={() => autoFillReps(i)}
                style={{ flex: 1, minWidth: 0, background: "#1a1a28", border: "1px solid #2a2a3a", borderRadius: 7, color: "#eee", fontSize: 13, padding: "8px", fontFamily: "inherit", textAlign: "center" }} />
              <input type="number" inputMode="numeric" placeholder={repsHint[i] || "reps"} value={set.reps}
                onChange={e => onChange(i, "reps", e.target.value)} onBlur={() => autoFillReps(i)}
                style={{ flex: 1, minWidth: 0, background: "#1a1a28", border: "1px solid #2a2a3a", borderRadius: 7, color: "#eee", fontSize: 13, padding: "8px", fontFamily: "inherit", textAlign: "center" }} />
              <div style={{ minWidth: 52, display: "flex", alignItems: "center", justifyContent: "flex-end", color: set.kg && set.reps ? "#888" : "#333", fontSize: 11, fontWeight: 600 }}>
                {set.kg && set.reps ? formatVolume((parseFloat(set.kg)||0)*(parseInt(set.reps)||0)) : "—"}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function WorkoutCard({ workout, weekIdx, allWeeks, weekData, onUpdate }) {
  const [open, setOpen] = useState(false);
  const wVol = calcWorkoutVolume(weekData?.[workout.id]);
  const prevVol = weekIdx > 0 ? calcWorkoutVolume(allWeeks[weekIdx-1]?.[workout.id]) : null;
  const diff = prevVol !== null && prevVol > 0 ? wVol - prevVol : null;
  const diffPct = diff !== null && prevVol > 0 ? Math.round((diff/prevVol)*100) : null;
  const totalSets = workout.exercises.reduce((s,e) => s + e.sets, 0);
  const filledSets = workout.exercises.reduce((s,ex) => s + (weekData?.[workout.id]?.[ex.id] || []).filter(st => st.kg && st.reps).length, 0);
  return (
    <div style={{ background: "#16161f", border: `1.5px solid ${open ? workout.color+"66" : "#2a2a3a"}`, borderRadius: 14, marginBottom: 10, overflow: "hidden" }}>
      <div onClick={() => setOpen(o => !o)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", cursor: "pointer", background: open ? workout.color+"08" : "transparent" }}>
        <span style={{ fontSize: 20 }}>{workout.icon}</span>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
            <span style={{ color: workout.color, fontWeight: 700, fontSize: 13 }}>{workout.label}</span>
            {filledSets > 0 && <span style={{ color: "#444", fontSize: 10 }}>{filledSets}/{totalSets} séries</span>}
          </div>
          <ScoreBar pct={Math.round((filledSets/totalSets)*100)} color={workout.color} />
        </div>
        <div style={{ textAlign: "right", marginLeft: 8 }}>
          {wVol > 0 ? (
            <>
              <div style={{ color: workout.color, fontWeight: 900, fontSize: 16 }}>{formatVolume(wVol)}</div>
              {diffPct !== null && <div style={{ fontSize: 10, fontWeight: 700, color: diff >= 0 ? "#4ade80" : "#f87171" }}>{diff >= 0 ? "▲" : "▼"} {Math.abs(diffPct)}%</div>}
            </>
          ) : <div style={{ color: "#2a2a3a", fontSize: 13 }}>—</div>}
        </div>
        <span style={{ color: "#333", fontSize: 12 }}>{open ? "▲" : "▼"}</span>
      </div>
      {open && (
        <div style={{ padding: "4px 14px 14px" }}>
          <div style={{ borderTop: `1px solid ${workout.color}22`, paddingTop: 12 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <div style={{ width: 22 }} />
              <div style={{ flex: 1, textAlign: "center", color: "#555", fontSize: 10 }}>CARGA (kg)</div>
              <div style={{ flex: 1, textAlign: "center", color: "#555", fontSize: 10 }}>REPS</div>
              <div style={{ minWidth: 52, textAlign: "right", color: "#555", fontSize: 10 }}>VOL.</div>
            </div>
            {workout.exercises.map(ex => {
              const sets = weekData?.[workout.id]?.[ex.id] || emptyExerciseSets(ex);
              return <ExerciseRow key={ex.id} exercise={ex} workout={workout} sets={sets} onChange={(si, field, val) => onUpdate(workout.id, ex.id, si, field, val)} />;
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function CardioDayCard({ day, entries, onAdd, onChange, onRemove }) {
  const totalMin = calcDayCardioMin(entries);
  return (
    <div style={{ background: "#16161f", border: "1.5px solid #2a2a3a", borderRadius: 14, padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <span style={{ color: "#fbbf24", fontWeight: 700, fontSize: 13 }}>{day.label}</span>
        {totalMin > 0 && <span style={{ color: "#fbbf24", fontWeight: 800, fontSize: 13 }}>{formatMin(totalMin)}</span>}
      </div>
      {entries.map((e, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
          <select value={e.tipo} onChange={ev => onChange(i, "tipo", ev.target.value)}
            style={{ flex: 1.3, background: "#1a1a28", border: "1px solid #2a2a3a", borderRadius: 7, color: "#eee", fontSize: 12, padding: "8px 6px", fontFamily: "inherit" }}>
            {CARDIO_TYPES.map(t => <option key={t.id} value={t.id}>{t.icon} {t.label}</option>)}
          </select>
          <input type="number" inputMode="numeric" placeholder="min" value={e.minutos}
            onChange={ev => onChange(i, "minutos", ev.target.value)}
            style={{ flex: 1, minWidth: 0, background: "#1a1a28", border: "1px solid #2a2a3a", borderRadius: 7, color: "#eee", fontSize: 13, padding: "8px", fontFamily: "inherit", textAlign: "center" }} />
          <button onClick={() => onRemove(i)} style={{ background: "transparent", border: "none", color: "#666", fontSize: 16, cursor: "pointer", padding: "0 4px" }}>×</button>
        </div>
      ))}
      <button onClick={onAdd} style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px dashed #2a2a3a", background: "transparent", color: "#666", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>+ Adicionar cardio</button>
    </div>
  );
}

function WeekComparison({ allWeeks, currentIdx }) {
  const pcts = allWeeks.map(w => calcWeekVolume(w));
  const filled = pcts.filter(v => v > 0);
  if (filled.length < 2) return (
    <div style={{ background: "#16161f", border: "1.5px solid #2a2a3a", borderRadius: 14, padding: 24, marginBottom: 16, textAlign: "center" }}>
      <div style={{ color: "#444", fontSize: 13 }}>Preencha pelo menos 2 semanas para ver o gráfico.</div>
    </div>
  );
  const maxVol = Math.max(...pcts);
  const W = 340, H = 120, PAD = 24;
  const xs = pcts.map((_,i) => PAD + (i/Math.max(pcts.length-1,1)) * (W-PAD*2));
  const ys = pcts.map(v => H - PAD - (v/maxVol)*(H-PAD*2));
  const pathD = pcts.map((_,i) => `${i===0?"M":"L"} ${xs[i]} ${ys[i]}`).join(" ");
  const areaD = `${pathD} L ${xs[pcts.length-1]} ${H-PAD} L ${xs[0]} ${H-PAD} Z`;
  return (
    <div style={{ background: "#16161f", border: "1.5px solid #2a2a3a", borderRadius: 14, padding: 18, marginBottom: 14 }}>
      <div style={{ color: "#a78bfa", fontWeight: 700, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>📈 Volume semanal total</div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ overflow: "visible" }}>
        <defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#7c3aed" stopOpacity="0.25"/><stop offset="100%" stopColor="#7c3aed" stopOpacity="0"/></linearGradient></defs>
        <path d={areaD} fill="url(#vg)" />
        <path d={pathD} fill="none" stroke="#7c3aed" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" />
        {pcts.map((v,i) => v > 0 && (
          <g key={i}>
            <circle cx={xs[i]} cy={ys[i]} r={4} fill={i===currentIdx ? "#a78bfa" : "#4a3a6a"} />
            <text x={xs[i]} y={ys[i]-7} textAnchor="middle" fill="#888" fontSize={8}>{formatVolume(v)}</text>
            <text x={xs[i]} y={H-4} textAnchor="middle" fill="#444" fontSize={8}>S{i+1}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

function WorkoutBreakdown({ allWeeks, currentIdx }) {
  const prev = currentIdx > 0 ? allWeeks[currentIdx-1] : null;
  const curr = allWeeks[currentIdx];
  if (!WORKOUTS.some(w => calcWorkoutVolume(curr?.[w.id]) > 0)) return null;
  return (
    <div style={{ background: "#16161f", border: "1.5px solid #2a2a3a", borderRadius: 14, padding: 18, marginBottom: 14 }}>
      <div style={{ color: "#a78bfa", fontWeight: 700, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>🔍 Volume por treino</div>
      {WORKOUTS.map(w => {
        const vol = calcWorkoutVolume(curr?.[w.id]);
        const prevVol = prev ? calcWorkoutVolume(prev?.[w.id]) : 0;
        const diff = prevVol > 0 ? vol - prevVol : null;
        const diffPct = diff !== null && prevVol > 0 ? Math.round((diff/prevVol)*100) : null;
        if (vol===0 && prevVol===0) return null;
        return (
          <div key={w.id} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <span style={{ fontSize: 16, width: 22 }}>{w.icon}</span>
            <div style={{ flex: 1 }}>
              <div style={{ color: "#ccc", fontSize: 12, marginBottom: 4 }}>{w.label}</div>
              <ScoreBar pct={prevVol > 0 ? Math.min((vol/prevVol)*100,130) : 100} color={w.color} />
            </div>
            <div style={{ textAlign: "right", minWidth: 64 }}>
              <div style={{ color: w.color, fontWeight: 700, fontSize: 13 }}>{vol > 0 ? formatVolume(vol) : "—"}</div>
              {diffPct !== null && vol > 0 && <div style={{ fontSize: 10, color: diff >= 0 ? "#4ade80" : "#f87171", fontWeight: 700 }}>{diff >= 0 ? "▲" : "▼"} {Math.abs(diffPct)}%</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CardioSummary({ allWeeks, currentIdx }) {
  const curr = allWeeks[currentIdx];
  const totalMin = calcWeekCardioMin(curr?.cardio);
  if (totalMin === 0) return null;
  const prev = currentIdx > 0 ? calcWeekCardioMin(allWeeks[currentIdx-1]?.cardio) : null;
  const diff = prev !== null && prev > 0 ? totalMin - prev : null;
  const diffPct = diff !== null && prev > 0 ? Math.round((diff/prev)*100) : null;
  const byType = {};
  CARDIO_DAYS.forEach(day => {
    (curr?.cardio?.[day.id] || []).forEach(e => {
      const min = parseInt(e.minutos) || 0;
      if (min > 0) byType[e.tipo] = (byType[e.tipo] || 0) + min;
    });
  });
  return (
    <div style={{ background: "#16161f", border: "1.5px solid #2a2a3a", borderRadius: 14, padding: 18, marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style={{ color: "#fbbf24", fontWeight: 700, fontSize: 11, textTransform: "uppercase", letterSpacing: 1 }}>🏃 Cardio da semana</div>
        <div style={{ textAlign: "right" }}>
          <div style={{ color: "#fbbf24", fontWeight: 900, fontSize: 16 }}>{formatMin(totalMin)}</div>
          {diffPct !== null && <div style={{ fontSize: 10, fontWeight: 700, color: diff >= 0 ? "#4ade80" : "#f87171" }}>{diff >= 0 ? "▲" : "▼"} {Math.abs(diffPct)}%</div>}
        </div>
      </div>
      {CARDIO_TYPES.filter(t => byType[t.id] > 0).map(t => (
        <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <span style={{ fontSize: 16, width: 22 }}>{t.icon}</span>
          <div style={{ flex: 1, color: "#aaa", fontSize: 12 }}>{t.label}</div>
          <div style={{ color: "#fbbf24", fontWeight: 700, fontSize: 13 }}>{formatMin(byType[t.id])}</div>
        </div>
      ))}
    </div>
  );
}

function ExerciseBests({ allWeeks }) {
  const bests = {};
  WORKOUTS.forEach(w => {
    w.exercises.forEach(ex => {
      let best = 0;
      allWeeks.forEach(week => { (week?.[w.id]?.[ex.id] || []).forEach(s => { const kg = parseFloat(s.kg)||0; if (kg>best) best=kg; }); });
      if (best > 0) bests[`${w.id}_${ex.id}`] = { name: ex.name, kg: best, color: w.color };
    });
  });
  const entries = Object.values(bests).filter(b => b.kg > 0);
  if (entries.length === 0) return null;
  return (
    <div style={{ background: "#16161f", border: "1.5px solid #2a2a3a", borderRadius: 14, padding: 18, marginBottom: 14 }}>
      <div style={{ color: "#a78bfa", fontWeight: 700, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>🏆 Maiores cargas registradas</div>
      {entries.sort((a,b) => b.kg-a.kg).slice(0,8).map((e,i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <div style={{ color: "#333", fontSize: 10, width: 16, textAlign: "right" }}>{i+1}</div>
          <div style={{ flex: 1, color: "#aaa", fontSize: 12 }}>{e.name}</div>
          <div style={{ color: e.color, fontWeight: 800, fontSize: 14 }}>{formatKg(e.kg)} kg</div>
        </div>
      ))}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [allWeeks, setAllWeeks] = useState(() => Array.from({ length: NUM_WEEKS }, emptyWeekData));
  const [weekIdx, setWeekIdx] = useState(0);
  const [view, setView] = useState("treino");
  const [status, setStatus] = useState("loading"); // loading | saving | saved | error
  const saveTimer = useRef(null);
  const loadedRef = useRef(false);

  useEffect(() => {
    cloudLoad()
      .then(data => {
        if (data && Array.isArray(data)) setAllWeeks(data);
        loadedRef.current = true;
        setStatus("saved");
      })
      .catch(err => {
        console.error("load error", err);
        loadedRef.current = true;
        setStatus("error");
      });
  }, []);

  const scheduleSave = (weeks) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setStatus("saving");
    saveTimer.current = setTimeout(() => {
      cloudSave(weeks).then(() => setStatus("saved")).catch(err => { console.error("save error", err); setStatus("error"); });
    }, 700);
  };

  const saveNow = () => {
    setStatus("saving");
    cloudSave(allWeeks).then(() => setStatus("saved")).catch(err => { console.error(err); setStatus("error"); });
  };

  const updateSet = (weekI, workoutId, exId, setIdx, field, val) => {
    setAllWeeks(prev => {
      const next = prev.map((w, wi) => {
        if (wi !== weekI) return w;
        const workout = { ...(w[workoutId] || {}) };
        const ex = WORKOUTS.find(wk => wk.id === workoutId)?.exercises.find(e => e.id === exId);
        const sets = [...(workout[exId] || emptyExerciseSets(ex))];
        sets[setIdx] = { ...sets[setIdx], [field]: val };
        workout[exId] = sets;
        return { ...w, [workoutId]: workout };
      });
      if (loadedRef.current) scheduleSave(next);
      return next;
    });
  };

  const addCardio = (weekI, dayId) => {
    setAllWeeks(prev => {
      const next = prev.map((w, wi) => {
        if (wi !== weekI) return w;
        const cardio = { ...(w.cardio || emptyCardioData()) };
        cardio[dayId] = [...(cardio[dayId] || []), { tipo: CARDIO_TYPES[0].id, minutos: "" }];
        return { ...w, cardio };
      });
      if (loadedRef.current) scheduleSave(next);
      return next;
    });
  };

  const updateCardio = (weekI, dayId, idx, field, val) => {
    setAllWeeks(prev => {
      const next = prev.map((w, wi) => {
        if (wi !== weekI) return w;
        const cardio = { ...(w.cardio || emptyCardioData()) };
        const entries = [...(cardio[dayId] || [])];
        entries[idx] = { ...entries[idx], [field]: val };
        cardio[dayId] = entries;
        return { ...w, cardio };
      });
      if (loadedRef.current) scheduleSave(next);
      return next;
    });
  };

  const removeCardio = (weekI, dayId, idx) => {
    setAllWeeks(prev => {
      const next = prev.map((w, wi) => {
        if (wi !== weekI) return w;
        const cardio = { ...(w.cardio || emptyCardioData()) };
        cardio[dayId] = (cardio[dayId] || []).filter((_, i) => i !== idx);
        return { ...w, cardio };
      });
      if (loadedRef.current) scheduleSave(next);
      return next;
    });
  };

  const weekVol = calcWeekVolume(allWeeks[weekIdx]);
  const prevWeekVol = weekIdx > 0 ? calcWeekVolume(allWeeks[weekIdx-1]) : null;
  const weekDiff = prevWeekVol && prevWeekVol > 0 ? Math.round(((weekVol-prevWeekVol)/prevWeekVol)*100) : null;

  const statusLabel = { loading: "⏳ carregando...", saving: "⏳ salvando...", saved: "☁️ salvo na nuvem", error: "⚠️ erro · tocar p/ tentar" }[status] || "";
  const statusColor = { saving: "#facc15", saved: "#4ade80", error: "#f87171", loading: "#facc15" }[status] || "#555";

  if (status === "loading") return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 32, marginBottom: 12 }}>☁️</div>
        <div style={{ color: "#555", fontSize: 13 }}>Carregando da nuvem...</div>
      </div>
    </div>
  );

  return (
    <div>
      <div style={{ background: "linear-gradient(135deg,#0a1a1a 0%,#0e0e18 100%)", borderBottom: "1px solid #1a2a2a", padding: "22px 20px 18px" }}>
        <div style={{ maxWidth: 480, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 3, gap: 10 }}>
            <div style={{ color: "#34d399", fontSize: 10, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase" }}>Controle de Volume · 2026</div>
            <div onClick={saveNow} style={{ fontSize: 10, color: statusColor, fontWeight: 600, cursor: "pointer", padding: "4px 8px", borderRadius: 6, background: status === "error" ? "#3a1a1a" : "transparent", border: status === "error" ? "1px solid #f87171" : "1px solid transparent", whiteSpace: "nowrap", flexShrink: 0 }}>{statusLabel}</div>
          </div>
          <h1 style={{ fontSize: 20, fontWeight: 900, color: "#fff", letterSpacing: -0.5, marginBottom: 2 }}>Volume Tracker</h1>
          <div style={{ color: "#444", fontSize: 11 }}>séries × reps × carga · comparação semana a semana</div>
          <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
            {[
              { label: "Semana atual", value: `S${weekIdx+1}` },
              { label: "Volume semana", value: weekVol > 0 ? formatVolume(weekVol) : "—" },
              { label: "vs semana ant.", value: weekDiff !== null && weekVol > 0 ? `${weekDiff>=0?"+":""}${weekDiff}%` : "—", color: weekDiff !== null ? (weekDiff>=0?"#4ade80":"#f87171") : "#444" },
            ].map(s => (
              <div key={s.label} style={{ flex: 1, background: "#0a1a1a", borderRadius: 10, padding: "10px 8px", border: "1px solid #1a2a2a", textAlign: "center" }}>
                <div style={{ color: s.color||"#34d399", fontWeight: 800, fontSize: 17 }}>{s.value}</div>
                <div style={{ color: "#3a4a3a", fontSize: 9, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 480, margin: "0 auto", padding: "14px 20px 0" }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 5, marginBottom: 16 }}>
          {allWeeks.map((w, i) => {
            const vol = calcWeekVolume(w);
            return (
              <button key={i} onClick={() => setWeekIdx(i)} style={{ padding: "7px 2px", borderRadius: 8, border: `1.5px solid ${weekIdx===i?"#34d399":"#1a2a2a"}`, background: weekIdx===i?"#0a1a1a":"#16161f", cursor: "pointer", textAlign: "center" }}>
                <div style={{ color: weekIdx===i?"#34d399":"#444", fontSize: 10, fontWeight: 700 }}>S{i+1}</div>
                <div style={{ width: 7, height: 7, borderRadius: "50%", background: vol>0?"#34d399":"#1a2a2a", margin: "3px auto 0" }} />
              </button>
            );
          })}
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          {[["treino","Registrar"],["cardio","Cardio"],["resumo","Resumo"]].map(([v,label]) => (
            <button key={v} onClick={() => setView(v)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 13, background: view===v?"#14532d":"#16161f", color: view===v?"#4ade80":"#555" }}>{label}</button>
          ))}
        </div>

        {view === "treino" && (
          <>
            <div style={{ display: "flex", gap: 4, marginBottom: 16, overflowX: "auto", paddingBottom: 4 }}>
              {WORKOUTS.map(w => (
                <a key={w.id} href={`#w-${w.id}`} style={{ display: "flex", flexDirection: "column", alignItems: "center", background: "#16161f", border: `1px solid ${w.color}44`, borderRadius: 8, padding: "6px 10px", textDecoration: "none", flexShrink: 0 }}>
                  <span style={{ fontSize: 14 }}>{w.icon}</span>
                  <span style={{ color: w.color, fontSize: 9, fontWeight: 700, marginTop: 2 }}>{w.day}</span>
                </a>
              ))}
            </div>
            {WORKOUTS.map(w => (
              <div key={w.id} id={`w-${w.id}`}>
                <WorkoutCard workout={w} weekIdx={weekIdx} allWeeks={allWeeks} weekData={allWeeks[weekIdx]} onUpdate={(wId, exId, si, field, val) => updateSet(weekIdx, wId, exId, si, field, val)} />
              </div>
            ))}
            <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
              <button onClick={() => setWeekIdx(i => Math.max(0,i-1))} disabled={weekIdx===0} style={{ flex: 1, padding: 12, borderRadius: 10, border: "1px solid #1a2a2a", background: "#16161f", color: weekIdx===0?"#1a2a2a":"#666", cursor: weekIdx===0?"default":"pointer", fontWeight: 700, fontSize: 13 }}>← Semana anterior</button>
              <button onClick={() => setWeekIdx(i => Math.min(NUM_WEEKS-1,i+1))} disabled={weekIdx===NUM_WEEKS-1} style={{ flex: 1, padding: 12, borderRadius: 10, border: "1px solid #1a2a2a", background: "#16161f", color: weekIdx===NUM_WEEKS-1?"#1a2a2a":"#666", cursor: weekIdx===NUM_WEEKS-1?"default":"pointer", fontWeight: 700, fontSize: 13 }}>Próxima →</button>
            </div>
          </>
        )}

        {view === "cardio" && (
          <>
            {CARDIO_DAYS.map(day => (
              <CardioDayCard
                key={day.id}
                day={day}
                entries={allWeeks[weekIdx]?.cardio?.[day.id] || []}
                onAdd={() => addCardio(weekIdx, day.id)}
                onChange={(i, field, val) => updateCardio(weekIdx, day.id, i, field, val)}
                onRemove={(i) => removeCardio(weekIdx, day.id, i)}
              />
            ))}
            <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
              <button onClick={() => setWeekIdx(i => Math.max(0,i-1))} disabled={weekIdx===0} style={{ flex: 1, padding: 12, borderRadius: 10, border: "1px solid #1a2a2a", background: "#16161f", color: weekIdx===0?"#1a2a2a":"#666", cursor: weekIdx===0?"default":"pointer", fontWeight: 700, fontSize: 13 }}>← Semana anterior</button>
              <button onClick={() => setWeekIdx(i => Math.min(NUM_WEEKS-1,i+1))} disabled={weekIdx===NUM_WEEKS-1} style={{ flex: 1, padding: 12, borderRadius: 10, border: "1px solid #1a2a2a", background: "#16161f", color: weekIdx===NUM_WEEKS-1?"#1a2a2a":"#666", cursor: weekIdx===NUM_WEEKS-1?"default":"pointer", fontWeight: 700, fontSize: 13 }}>Próxima →</button>
            </div>
          </>
        )}

        {view === "resumo" && (
          <>
            <WeekComparison allWeeks={allWeeks} currentIdx={weekIdx} />
            <CardioSummary allWeeks={allWeeks} currentIdx={weekIdx} />
            <WorkoutBreakdown allWeeks={allWeeks} currentIdx={weekIdx} />
            <ExerciseBests allWeeks={allWeeks} />
            {calcWeekVolume(allWeeks[weekIdx]) === 0 && calcWeekCardioMin(allWeeks[weekIdx]?.cardio) === 0 && (
              <div style={{ background: "#16161f", border: "1.5px solid #1a2a2a", borderRadius: 14, padding: 32, textAlign: "center" }}>
                <div style={{ color: "#444", fontSize: 13 }}>Nenhum dado registrado ainda.<br />Vá para Registrar e preencha seus treinos!</div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
